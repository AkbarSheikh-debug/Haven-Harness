name: docs

# Builds the documentation site from docs/guide with scripts/docs-site.ts (no dependencies; it fails on a broken link)
# and deploys it to GitHub Pages. Pull requests only build it, so a broken link is caught before it merges.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "scripts/docs-site.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/guide/**"
      - "scripts/docs-site.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --disable-proto=throw scripts/docs-site.ts --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
