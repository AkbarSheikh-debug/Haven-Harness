name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the fully tested platform and must pass.
          - os: windows-latest
            experimental: false
          # Linux and macOS run the suite and report, but do not block yet.
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The native helper (safe file access, keychain, Windows box). Rust is preinstalled on GitHub runners.
      - run: pnpm build:sandbox
      - run: pnpm typecheck
      - run: pnpm test
