[package]
name = "hn-sandbox"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Path-safe file access, keychain and the Windows native box (AppContainer + Job Object) for hn."

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security_Credentials",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
